name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Issue #318 — rely on rust-toolchain.toml for the pinned toolchain,
      # targets, and components so CI matches local builds.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Issue #320 — enforce SPDX license headers on all source files
      - name: Check SPDX license headers
        run: |
          missing=0
          while IFS= read -r file; do
            if ! head -n 1 "$file" | grep -q 'SPDX-License-Identifier: MIT'; then
              echo "::error file=$file::Missing SPDX license header"
              missing=1
            fi
          done < <(find . \( -name '*.rs' -o -name '*.ts' \) -not -path '*/target/*' -not -path '*/node_modules/*')
          exit $missing

      # Issue #99 — WASM build verification
      - name: Build (WASM)
        run: cargo build --release --target wasm32-unknown-unknown

      # Issue #102 — Test suite verification
      - name: Test
        run: cargo test

      # Issue #100 — Clippy lint check
      - name: Clippy
        run: cargo clippy -- -D warnings

      # Issue #101 — Formatting check
      - name: Format check
        run: cargo fmt --check

      # Issue #321 — code coverage via cargo-llvm-cov (accurate for no_std)
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      # Issue #321 — coverage gate: fail CI if line coverage drops below 80%
      - name: Enforce coverage gate (>= 80%)
        run: |
          total=$(cargo llvm-cov report --summary-only --json 2>/dev/null \
            | grep -o '"lines":{[^}]*"percent":[0-9.]*' \
            | grep -o '[0-9.]*$')
          if [ -z "$total" ]; then
            echo "::error::Unable to determine coverage percentage"
            exit 1
          fi
          echo "Line coverage: ${total}%"
          awk -v cov="$total" 'BEGIN { if (cov + 0 < 80) { printf "::error::Coverage %.2f%% is below the 80%% threshold\n", cov; exit 1 } }'

      # Issue #321 — upload coverage report to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

      # Issue #105 — Dependency vulnerability scanning
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: cargo audit
